<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Downthread">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a24"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#a8b4ff"/>
      <stop offset=".55" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#4fe3c1"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".08" r=".9">
      <stop offset="0" stop-color="#7c8cff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="29.25" fill="none"
        stroke="#ffffff" stroke-opacity=".10" stroke-width="1.5"/>

  <!-- Three chevrons, each narrower than the one above: going down the thread,
       and the download it ends in. Reads at 16px because it is only three strokes. -->
  <g fill="none" stroke="url(#mark)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 43 L64 62 L94 43"/>
    <path d="M45 68 L64 80 L83 68" stroke-opacity=".72"/>
    <path d="M55 90 L64 96 L73 90" stroke-opacity=".45"/>
  </g>
</svg>
